name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - pubspec.yaml

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  detect-version:
    name: Detect version change
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare pubspec versions
        id: version
        shell: bash
        run: |
          current_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          previous_commit="${{ github.event.before }}"

          if [[ -z "$current_version" ]]; then
            echo "Version was not found in pubspec.yaml."
            exit 1
          fi

          if [[ "$previous_commit" =~ ^0+$ ]]; then
            previous_version=""
          else
            previous_version="$(
              git show "${previous_commit}:pubspec.yaml" 2>/dev/null |
              sed -n 's/^version:[[:space:]]*//p' |
              head -n 1
            )"
          fi

          echo "Previous version: ${previous_version:-not found}"
          echo "Current version: $current_version"

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            safe_version="${current_version//+/-}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$safe_version" >> "$GITHUB_OUTPUT"
          fi

  build-aab:
    name: Build signed Android App Bundle
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.32.4"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Restore Android upload key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > android/app/upload-keystore.jks

      - name: Create Android signing properties
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_PASSWORD" ||
                -z "$ANDROID_KEY_ALIAS" ||
                -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "One or more Android signing secrets are missing."
            exit 1
          fi

          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Verify AAB signature
        run: >
          jarsigner -verify
          build/app/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: scout-app-${{ needs.detect-version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing files
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties
          rm -f android/app/upload-keystore.jks